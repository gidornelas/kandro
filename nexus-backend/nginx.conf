# NEXUS Production Nginx Configuration
# Reverse proxy with SSL termination, rate limiting, and static file serving

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Performance tuning
  sendfile       on;
  tcp_nopush     on;
  tcp_nodelay    on;
  keepalive_timeout  65;
  keepalive_requests 1000;
  client_max_body_size 50M;

  # Rate limiting zones
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=uploads:10m rate=5r/s;

  # SSL configuration (Let's Encrypt / self-signed for dev)
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  # Upstream: NEXUS Fastify app (round-robin across instances)
  upstream nexus_backend {
    server app:3000;
    # Add more instances when scaling:
    # server app:3001;
    # server app:3002;
    keepalive 32;
  }

  server {
    listen 80;
    server_name nexus.local;
    # Redirect HTTP to HTTPS
    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl http2;
    server_name nexus.local;

    # SSL certificates (auto-generated self-signed in Docker, or mount real certs)
    ssl_certificate     /etc/nginx/ssl/nexus.crt;
    ssl_certificate_key /etc/nginx/ssl/nexus.key;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Health check endpoint (no auth, internal)
    location /api/health {
      proxy_pass http://nexus_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      access_log off;
    }

    # API endpoints
    location /api/ {
      limit_req zone=api burst=50 nodelay;
      proxy_pass http://nexus_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;

      # WebSocket support (Socket.io)
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # WebSocket endpoint (Socket.io)
    location /socket.io/ {
      proxy_pass http://nexus_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 86400s;  # 24h for long-lived WebSocket connections
      proxy_send_timeout 86400s;
    }

    # File download redirect endpoint
    location /api/files/ {
      proxy_pass http://nexus_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Frontend static files (Vite build) — served via CDN in production
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }
}
